global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout check 5s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

frontend mysql
    bind :3306
    default_backend galera

backend galera
    # Prefer one writer to reduce certification conflicts in Kuma migrations.
    option httpchk GET /
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr libc,none
    server mariadb mariadb:3306 check port 9200
    server mariadb-2 mariadb-2:3306 check port 9200 backup
    server mariadb-3 mariadb-3:3306 check port 9200 backup

frontend health
    mode http
    bind :8404
    monitor-uri /health
    monitor fail if { nbsrv(galera) lt 1 }
    stats enable
    stats uri /stats
